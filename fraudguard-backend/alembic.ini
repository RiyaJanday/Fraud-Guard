# ============================================================================
# Alembic configuration
#
# The database URL is deliberately NOT hardcoded here — env.py pulls it from
# app.core.config.get_settings() (i.e. from .env) at runtime, so there is
# exactly one place DATABASE_URL is ever configured.
# ============================================================================

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
